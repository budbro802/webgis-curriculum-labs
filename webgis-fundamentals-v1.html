<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Leaflet Fundamentals - Cities from Array</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <style>
      body {
        margin: 0;
      }

      #map {
        height: 100vh;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script>
      // VARIABLES
      const mapCenter = [37.5, -80.0];
      const zoomLevel = 5;

      // CREATE MAP
      const map = L.map("map");
      map.setView(mapCenter, zoomLevel);

      // BASEMAP
      let bm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
      });
      bm.addTo(map);

      // ARRAY WITH CITY DATA
      // [city name, latitude, longitude, population]
      const cities = [
        ["Atlanta", 33.749, -84.388, 529110],
        ["New York", 40.7128, -74.006, 8336817],
        ["Chicago", 41.8781, -87.6298, 2746388],
      ];

      let popupText =
        "City: " + cities[0][0] + "<br>Population: " + cities[0][3];
      let m1 = L.marker([cities[0][1], cities[0][2]]);
      m1.addTo(map);
      m1.bindPopup(popupText);

      popupText = "City: " + cities[1][0] + "<br>Population: " + cities[1][3];
      let m2 = L.marker([cities[1][1], cities[1][2]]);
      m2.addTo(map);
      m2.bindPopup(popupText);

      popupText = "City: " + cities[2][0] + "<br>Population: " + cities[2][3];
      let m3 = L.marker([cities[2][1], cities[2][2]]);
      m3.addTo(map);
      m3.bindPopup(popupText);

      // Exercise:
      // Change the popups so they also shows a number,
      // for example population and, bonus, write population in next line
      // of the popup
      // Hint: use html e.g. <br>
    </script>
  </body>
</html>
