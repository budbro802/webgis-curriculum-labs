<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Leaflet GeoJSON Fetch Example</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      crossorigin=""
    ></script>
    <style>
      body {
        margin: 0;
      }

      #map {
        height: 100vh;
        width: 100%;
      }

      #info {
        position: absolute;
        bottom: 20px;
        left: 20px;
        z-index: 1000;
        background: white;
        padding: 10px;
        font-family: Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <div id="info">Cities loaded: <span id="cityCount">0</span></div>

    <script>
      // MAP SETUP
      const map = L.map("map");
      map.setView([33.7, -84.4], 5);

      let bm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
      });
      bm.addTo(map);

      // FUNCTION: GET CITY TYPE
      function getCityType(pop) {
        if (pop > 3000000) {
          return "Megacity";
        } else if (pop > 1000000) {
          return "Large city";
        } else {
          return "Small city";
        }
      }

      // FUNCTION: GET MARKER RADIUS
      function getMarkerRadius(pop) {
        if (pop > 3000000) {
          return 9;
        } else if (pop > 1000000) {
          return 6;
        } else {
          return 3;
        }
      }

      // FUNCTION: LOAD GEOJSON WITH SERVER!!!!!!!!!!!!!!!!!!!!!!!
      async function loadCities() {
        let response = await fetch("Javascript/data/cities.geojson");
        let data = await response.json();

        console.log(data);

        document.getElementById("cityCount").innerText = data.features.length;

        L.geoJSON(data, {
          // look
          pointToLayer: function (feature, latlng) {
            let pop = feature.properties.population;
            let radius = getMarkerRadius(pop);

            let markerOptions = {
              radius: radius,
              color: "orange",
              fillColor: "white",
              fillOpacity: 0.8,
              weight: 1.5,
            };

            return L.circleMarker(latlng, markerOptions);
          },
          // do
          onEachFeature: function (feature, layer) {
            let name = feature.properties.name;
            let pop = feature.properties.population;
            let cityType = getCityType(pop);
            let country = feature.properties.country;

            let popupText = "City: " + name;
            popupText += "<br>Population: " + pop;
            popupText += "<br>Type: " + cityType;
            popupText += "<br>Country: " + country;

            layer.bindPopup(popupText);
          },
        }).addTo(map);
      }

      loadCities();

      // Exercise:
      // 1. Tweak the look of the circle.
      // 2. Add country prop for each city to GeoJSON and add to the features popup
    </script>
  </body>
</html>
