<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Leaflet Weather API Fetch Example</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <style>
        body {
            margin: 0;
        }

        #map {
            height: 100vh;
            width: 100%;
        }

        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            background: white;
            padding: 10px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <div id="info">
        Temperature: <span id="temperature">loading...</span>
    </div>

    <script>
        // MAP SETUP
        const map = L.map("map");
        map.setView([52.52, 13.41], 10);

        let bm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "&copy; OpenStreetMap contributors"
        });

        bm.addTo(map);

        // FUNCTION: LOAD WEATHER FROM API
        async function loadWeather() {
            let latitude = 52.52;
            let longitude = 13.41;

            let url = "https://api.open-meteo.com/v1/forecast?latitude=" + latitude +
                "&longitude=" + longitude +
                "&hourly=temperature_2m";

            let response = await fetch(url);
            let data = await response.json();

            // API DATA STRUCTURE
            let times = data.hourly.time;
            let temperatures = data.hourly.temperature_2m;
            let unit = data.hourly_units.temperature_2m;

            // SIMPLE VERSION:
            // CURRENT HOUR VERSION
            let now = new Date();

            // get current hour (0–23)
            let currentHour = now.getHours();

            // use current hour as array index
            let currentTime = times[currentHour];
            let currentTemperature = temperatures[currentHour];

            document.getElementById("temperature").innerText =
                currentTemperature + " " + unit;

            let marker = L.marker([latitude, longitude]);
            marker.addTo(map);

            let popupText = "Weather station / location";
            popupText += "<br>Time: " + currentTime;
            popupText += "<br>Temperature: " + currentTemperature + " " + unit;

            marker.bindPopup(popupText);
            marker.openPopup();
        }

        loadWeather();

        // Exercise:
        // 1. Change latitude and longitude to another city.
        // 2. Add the city name to the popup.
        // 3. Instead of times[0], use another index like times[10].
        // 4. Add wind speed from the API.
    </script>
</body>

</html>
