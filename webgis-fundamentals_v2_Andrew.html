<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Leaflet Fundamentals - Cities from Array</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <style>
      body {
        margin: 0;
      }

      #map {
        height: 100vh;
        width: 100%;
      }
    </style>
  </head>

  <body>
    <div id="map"></div>
    <div
      style="
        position: absolute;
        top: 10px;
        left: 50px;
        z-index: 1000;
        background: white;
        padding: 10px;
        border-radius: 5px;
        box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.3);
      "
    >
      <h2 style="margin-top: 0">Add City</h2>
      <!-- INPUTS  -->

      <!-- City -->
      <div class="input-group" style="margin-bottom: 10px">
        <label for="cityName" style="display: block; padding-bottom: 5px"
          >City Name:</label
        >
        <input id="cityName" style="display: block" placeholder="City name" />
      </div>

      <!-- Latitude -->
      <div class="input-group" style="margin-bottom: 10px">
        <label for="lat" style="padding-right: 15px; display: block"
          >Latitude:</label
        >
        <input id="lat" placeholder="Lat" />
      </div>

      <!-- Longitude -->
      <div class="input-group" style="margin-bottom: 10px">
        <label for="lon" style="padding-right: 5px; display: block"
          >Longitude:</label
        >
        <input id="lon" placeholder="Lon" />
      </div>

      <!-- Population -->
      <div class="input-group" style="margin-bottom: 10px">
        <label for="population" style="display: block; padding-bottom: 5px"
          >Population:</label
        >
        <input id="population" placeholder="Population" />
      </div>

      <button
        id="addCity"
        style="
          width: 100%;
          padding: 10px;
          background: #007bff;
          color: white;
          border: none;
          border-radius: 5px;
          cursor: pointer;
        "
      >
        Add City
      </button>
    </div>

    <script>
      // VARIABLES
      const mapCenter = [37.5, -80.0];
      const zoomLevel = 5;

      // CREATE MAP
      const map = L.map("map");
      map.setView(mapCenter, zoomLevel);

      // BASEMAP
      let bm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
      });
      bm.addTo(map);

      // ARRAY WITH CITY DATA
      // [name, latitude, longitude]
      const cities = [
        ["Atlanta", 33.749, -84.388, 529110],
        ["New York", 40.7128, -74.006, 8336817],
        ["Chicago", 41.8781, -87.6298, 2746388],
      ];

      let popupText =
        "City: " + cities[0][0] + "<br>Population: " + cities[0][3];
      let m1 = L.marker([cities[0][1], cities[0][2]]);
      m1.addTo(map);
      m1.bindPopup(popupText);

      popupText = "City: " + cities[1][0] + "<br>Population: " + cities[1][3];
      let m2 = L.marker([cities[1][1], cities[1][2]]);
      m2.addTo(map);
      m2.bindPopup(popupText);

      popupText = "City: " + cities[2][0] + "<br>Population: " + cities[2][3];
      let m3 = L.marker([cities[2][1], cities[2][2]]);
      m3.addTo(map);
      m3.bindPopup(popupText);

      //---------------------------------------
      // ADD CITY
      document.getElementById("addCity").addEventListener("click", function () {
        let name = document.getElementById("cityName").value;
        let lat = Number(document.getElementById("lat").value);
        let lon = Number(document.getElementById("lon").value);
        let population = Number(document.getElementById("population").value);
        // add to array
        cities.push([name, lat, lon, population]);
        alert(cities.length);

        // show on map
        let marker = L.marker([lat, lon]);
        marker.addTo(map);
        marker.bindPopup("City: " + name + "<br>Population: " + population);
      });

      // Exercise:
      // 1. Add a new input field for population
      // Hints:
      // - Add a new input field in the HTML
      // - Add a new variable to get the value of the input field
      // - Add population value to popup
    </script>
  </body>
</html>
