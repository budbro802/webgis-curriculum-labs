<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Leaflet Functions - Cities from Array</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <style>
      body {
        margin: 0;
      }

      #map {
        height: 100vh;
        width: 100%;
      }
    </style>
  </head>

  <body>
    <div id="map"></div>

    <div
      style="
        position: absolute;
        top: 10px;
        left: 50px;
        z-index: 1000;
        background: white;
        padding: 10px;
      "
    >
      <input id="cityName" placeholder="City name" />
      <input id="lat" placeholder="Lat" />
      <input id="lon" placeholder="Lon" />
      <input id="pop" placeholder="Population" />
      <button id="addCity">Add City</button>
    </div>

    <script>
      // VARIABLES
      const mapCenter = [50.5, 10.5];
      const zoomLevel = 5;

      // CREATE MAP
      const map = L.map("map");
      map.setView(mapCenter, zoomLevel);

      // BASEMAP
      let bm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
      });
      bm.addTo(map);

      // ARRAY WITH CITY DATA
      // [name, latitude, longitude, population]
      const cities = [
        ["Berlin", 52.52, 13.405, 4000000],
        ["Paris", 48.8566, 2.3522, 2100000],
        ["Rome", 41.9028, 12.4964, 2750000],
      ];

      // SHOW ALL CITIES WITH A LOOP
      for (let i = 0; i < cities.length; i++) {
        let name = cities[i][0];
        let lat = cities[i][1];
        let lon = cities[i][2];
        let pop = cities[i][3];

        if (isValidLatLon(lat, lon) === false) {
          alert(
            "Your city " +
              name +
              " is outside of lat lon, we won't add it, please check your data.",
          );
          continue;
        }

        addCityMarker(name, lat, lon, pop);
      }

      //---------------------------------------
      // FUNCTION 1: CHECK LAT / LON
      function isValidLatLon(lat, lon) {
        if (lat > 90 || lat < -90 || lon > 180 || lon < -180) {
          return false;
        } else {
          return true;
        }
      }

      // FUNCTION 2: GET CITY TYPE
      function getCityType(pop) {
        let cityType = "";

        if (pop > 3000000) {
          cityType = "Megacity";
        } else if (pop > 1000000) {
          cityType = "Large city";
        } else {
          cityType = "Small city";
        }

        return cityType;
      }

      // FUNCTION 3: ADD MARKER TO MAP
      function addCityMarker(name, lat, lon, pop) {
        let marker = L.marker([lat, lon]);
        marker.addTo(map);

        let cityType = getCityType(pop);

        let popupText = "City: " + name;
        popupText = popupText + "<br>Population: " + pop;
        popupText = popupText + "<br>Type: " + cityType;

        marker.bindPopup(popupText);
      }

      //---------------------------------------
      // ADD CITY
      document.getElementById("addCity").addEventListener("click", function () {
        let name = document.getElementById("cityName").value;
        let lat = Number(document.getElementById("lat").value);
        let lon = Number(document.getElementById("lon").value);
        let pop = Number(document.getElementById("pop").value);

        if (isValidLatLon(lat, lon) === false) {
          alert(
            "Your city " +
              name +
              " is outside of lat lon, we won't add it, please check your data.",
          );
          return;
        }

        // Add function here
        function clearInputs() {
          name = document.getElementById("cityName").value = "";
          lat = document.getElementById("lat").value = "";
          lon = document.getElementById("lon").value = "";
          pop = document.getElementById("pop").value = "";
        }

        cities.push([name, lat, lon, pop]);

        addCityMarker(name, lat, lon, pop);

        clearInputs();
      });

      // Exercise:
      // Create a function called clearInputs().
      // It should clear cityName, lat, lon and pop after adding a city.
      // Then call clearInputs() at the end of the addCity event listener.
    </script>
  </body>
</html>
